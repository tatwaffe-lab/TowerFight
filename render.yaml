# Render Blueprint — legt den Service automatisch an.
# In Render: "New" -> "Blueprint" -> Repo auswählen. Render liest diese Datei.
services:
  - type: web
    name: tower-draft-siege
    runtime: node
    plan: free             # Free: schläft nach 15 Min OHNE Traffic ein. Während einer Partie
                           # fließt ständig WebSocket-Verkehr (plus Client-Heartbeat), das hält
                           # den Dienst wach. Nur der allererste Aufruf nach einer Pause dauert
                           # ~1 Minute (Kaltstart). Für Dauerbetrieb später auf "starter" wechseln.
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
